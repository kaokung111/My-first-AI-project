
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First AI Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101629;
            color: white;
            text-align: center;
        }

        .container {
            padding: 100px 20px;
        }

        h1 {
            color: #39ff88;
            font-size: 42px;
        }

        p {
            font-size: 18px;
            color: #cccccc;
        }

        button {
            background: #39ff88;
            color: #101629;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My First AI Website</h1>

        <p>Welcome to my first website!</p>

        <p>I am learning to build websites with AI.</p>

        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </div>
</body>
</html>
